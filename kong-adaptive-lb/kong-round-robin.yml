_format_version: "3.0"
upstreams:
  - name: backend-upstream-round-robin
    algorithm: round-robin
    targets:
      - target: registration-8081:8081
        weight: 100
      - target: registration-8082:8082
        weight: 100
      - target: registration-8083:8083
        weight: 100
services:
  - name: backend-service
    url: http://backend-upstream-round-robin
    routes:
      - name: api-route
        strip_path: false
        paths:
          - /api
  - name: strategy-status-service
    url: http://localhost
    routes:
      - name: strategy-status-route
        paths:
          - /alb/strategy
        plugins:
          - name: request-termination
            config:
              status_code: 200
              message: "round-robin"
